# Alembic configuration. The migrations themselves are in alembic/versions/.
#
#   uv run alembic upgrade head          apply
#   uv run alembic downgrade -1          undo the last one
#   make migrate                         apply inside Compose
#
# There is deliberately no `sqlalchemy.url` here: env.py reads DATABASE_URL from the environment,
# which is where every other process gets it, and a DSN in a tracked file is a DSN in a diff.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Migrations are read in the order they were written far more often than they are looked up by
# revision id, and parallel sessions cannot both allocate "0002".
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
