# Sentinel implementation task graph — the single source of truth for the work breakdown.
#
# Consumed by:
#   - scripts/seed_issues.py        creates and updates the GitHub task issues
#   - .claude/hooks/session-init.sh reports ready-to-start tasks at session start
#   - docs/implementation-plan.md   the human-readable view of this file
#
# Rules
#   - `depends_on` means "that task's PR is merged", not "started".
#   - Tasks in the same wave are independent of each other and may run in parallel.
#   - `owns` is exclusive: a task must not modify files owned by another task.
#   - `adrs` links decision records; keep in sync with docs/adr/ front matter.
#   - Every package directory under src/sentinel/ carries an `__init__.py`, owned by the first
#     task to create the directory and listed here explicitly. Sub-packages would resolve as
#     namespace packages without one, but leaving it implicit means several parallel tasks each
#     decide independently, and two deciding differently is a conflict on a file nobody owns.

meta:
  repo: taxpon/sentinel
  target_repo: taxpon/superset
  target_base_branch: master

areas:
  - ops
  - data
  - devin
  - github
  - pipeline
  - api
  - analytics
  - dashboard
  - remediation

tasks:
  # ---------------------------------------------------------------- wave 0
  - id: T01
    title: Repository scaffolding and tooling
    wave: 0
    area: ops
    spec: docs/09-operations.md#configuration
    owns:
      - pyproject.toml
      - uv.lock
      - .python-version
      - Makefile
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - .env.example
      - src/sentinel/__init__.py
      - tests/test_env_example.py
    depends_on: []
    adrs: [2026-08-07-uv-for-dependencies-and-the-image]
    notes: >-
      Sets up uv, ruff, mypy, pytest, and the three-service Compose topology
      (api / worker / poller / db). Everything else branches from this, so keep
      it small and merge it first. tests/test_env_example.py holds .env.example
      and the configuration table in docs/09-operations.md to each other.

  - id: T02
    title: Configuration module
    wave: 0
    area: ops
    spec: docs/09-operations.md#configuration
    owns:
      - src/sentinel/config.py
      - tests/test_config.py
    depends_on: [T01]
    adrs: []
    notes: pydantic-settings. Every variable in the operations table, with the documented defaults.

  - id: T03
    title: Database layer, models and initial migration
    wave: 0
    area: data
    spec: docs/03-data-model.md
    owns:
      - src/sentinel/db.py
      - src/sentinel/models.py
      - alembic.ini
      - alembic/
    depends_on: [T02]
    adrs: [2026-08-07-transitions-are-append-only-events]
    notes: >-
      Sole owner of alembic/versions — creates exactly one initial migration.
      Later tasks needing schema changes must coordinate through this issue.

  - id: T04
    title: Test harness and fixtures
    wave: 0
    area: ops
    spec: docs/08-testing.md#orchestrator-tests
    owns:
      - tests/conftest.py
      - tests/factories.py
      - tests/fixtures/github/
    depends_on: [T03]
    adrs: []
    notes: >-
      Real Postgres from Compose (SKIP LOCKED cannot be emulated by SQLite),
      respx fixtures, httpx ASGITransport client, recorded GitHub payloads.

  - id: T05
    title: CI workflow for this repository
    wave: 0
    area: ops
    spec: docs/08-testing.md#ci-for-this-repository
    owns:
      - .github/workflows/ci.yml
    depends_on: [T01]
    adrs:
      - 2026-08-08-enforce-tests-with-source-by-diffing-the-pull-request
    notes: >-
      ruff, mypy, pytest on a Postgres service, dashboard build and tests,
      compose config validation. Also enforces P1: a change under src/sentinel/**
      must come with a change under tests/**.

  - id: T06
    title: Claude Code collaboration setup
    wave: 0
    area: ops
    spec: docs/implementation-plan.md#parallel-sessions
    owns:
      - CLAUDE.md
      - .claude/settings.json
      - .claude/hooks/
      - .claude/rules/
      - .claude/commands/
      - .github/pull_request_template.md
      - scripts/session_context.py
      - scripts/seed_issues.py
    depends_on: [T01]
    adrs: [2026-08-07-enforce-workflow-with-hooks]
    notes: >-
      SessionStart hook injects live task state; PreToolUse hook blocks
      `gh pr create` without a fresh review marker.

  - id: T07
    title: ADR framework, generated index and back-filled decisions
    wave: 0
    area: ops
    spec: docs/adr/index.md
    owns:
      - docs/adr/
      - scripts/gen_adr_index.py
    depends_on: []
    adrs: []
    notes: >-
      Also adds links from the Design decisions table in docs/02-architecture.md
      to the corresponding ADRs.

