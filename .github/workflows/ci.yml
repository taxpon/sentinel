name: CI

# Pushes are filtered to `main` on purpose: every task branch reaches `main` through a pull request,
# so an unfiltered `push` would only run the same commit twice.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # uv reads the interpreter version from .python-version and installs it if the runner lacks it.
      - run: make install
      - run: make lint
      - run: make typecheck
      - run: make adr-check

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: make install
      - run: make test-cov
      - name: Publish the coverage table to the run summary
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # T30 creates dashboard/. Until it lands there is nothing to build, and the skip is announced
      # as an annotation so that "dashboard CI never runs" cannot go unnoticed once it does exist.
      - name: Look for the dashboard
        id: probe
        run: |
          if [ -f dashboard/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Dashboard skipped::dashboard/package.json does not exist, so the build and component tests did not run. They start running on their own once T30 adds the directory."
          fi
      - uses: actions/setup-node@v7
        if: steps.probe.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        if: steps.probe.outputs.present == 'true'
        working-directory: dashboard
        run: npm ci
      - name: Build
        if: steps.probe.outputs.present == 'true'
        working-directory: dashboard
        run: npm run build
      - name: Component tests
        if: steps.probe.outputs.present == 'true'
        working-directory: dashboard
        run: npm test

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `env_file: .env` makes Compose refuse to load the project without one. The Makefile seeds it
      # from .env.example, which is what a fresh clone does too.
      - run: make .env
      - run: docker compose config --quiet

  tests-required:
    name: Source changes carry tests
    # Rule 1 in CLAUDE.md. Checked on pull requests only, where "the change" is a well-defined diff
    # against a base; on a push to main the pull request has already been through this gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Diff the pull request against its base
        env:
          # HEAD is the merge commit of the branch into this exact base, so a two-dot diff from the
          # base is the net change the pull request proposes.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"
          if grep -q '^src/sentinel/' "$RUNNER_TEMP/changed.txt" \
            && ! grep -q '^tests/' "$RUNNER_TEMP/changed.txt"; then
            echo "::error title=Missing tests::This pull request changes src/sentinel/ without changing anything under tests/. Every change to the orchestrator ships with the tests for it (CLAUDE.md, rule 1)."
            exit 1
          fi
