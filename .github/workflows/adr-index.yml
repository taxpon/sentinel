# `docs/adr/index.md` and `.claude/rules/adr-pointers.md` are derived from the front matter of the
# records in `docs/adr/`. Maintaining them on branches made every pull request that added a record
# conflict with every other one, in a file nobody edits by hand.
#
# So branches do not maintain them: they add their record and nothing else, and main regenerates
# here after the merge. Two branches adding a record now touch no common file at all, which is what
# makes the conflict impossible rather than merely automatic to resolve.
#
# The commit this pushes is made with GITHUB_TOKEN, and GitHub does not run workflows for such a
# push — so this cannot trigger itself.
name: ADR index

on:
  push:
    branches: [main]
    paths:
      - "docs/adr/**"
      - "docs/tasks.yaml"
      - "scripts/gen_adr_index.py"
      # This file too, so that a fix to the regeneration is applied by the fix itself rather than
      # waiting for the next record to happen along.
      - ".github/workflows/adr-index.yml"
  # For repairing an index that went stale while this workflow was failing.
  workflow_dispatch:

concurrency:
  group: adr-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate the ADR index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Regenerate
        run: make adr-index

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- docs/adr/index.md .claude/rules/adr-pointers.md; then
            echo "Index already matches the records; nothing to commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/adr/index.md .claude/rules/adr-pointers.md
          git commit -m 'Regenerate the ADR index'

          # Main can move between the checkout and the push — merging two pull requests in quick
          # succession is enough, and it rejected this push three times before this loop existed.
          # `concurrency` serialises the runs but not the merges they race.
          #
          # The retry throws its own commit away rather than rebasing it. There is nothing in it
          # worth keeping a conflict resolution for: the index is a pure function of `docs/adr/`,
          # so taking whatever main is now and regenerating from that produces the correct file in
          # one step, with no ours/theirs to get backwards.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); regenerating on top of what landed."
            git fetch origin main
            git reset --hard origin/main
            make adr-index
            if git diff --quiet -- docs/adr/index.md .claude/rules/adr-pointers.md; then
              echo "The commit that overtook us already carries a current index."
              exit 0
            fi
            git add docs/adr/index.md .claude/rules/adr-pointers.md
            git commit -m 'Regenerate the ADR index'
          done

          echo "::error::Could not push the regenerated index after three attempts."
          exit 1
