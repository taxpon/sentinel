[project]
name = "sentinel"
version = "0.1.0"
description = "Event-driven remediation pipeline built on the Devin API v3"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.27",
    "prometheus-client>=0.21",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
# These two predate ruff and belong to another task, so T01 must not reformat them; every other
# file under scripts/ is linted normally. T06 (session_context, seed_issues) runs `make format` on
# its own files and deletes its lines here.
extend-exclude = [
    "scripts/seed_issues.py",
    "scripts/session_context.py",
    # Ruff formats fenced Python inside Markdown. Most such blocks under docs/ are *quotations* of
    # code in other repositories, so reformatting one turns an accurate citation into a misquotation
    # of a file the reader is expected to open and compare against.
    "*.md",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["sentinel"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/sentinel"]
